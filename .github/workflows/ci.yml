name: Integração contínua

# A cada push ou pull request: roda o pipeline de ingestão, os testes e a avaliação do modelo.
# Se a avaliação ficar abaixo dos critérios mínimos, o job falha e a entrega é bloqueada.

on:
  push:
    branches: [main, sprint-4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API — pipeline, testes e avaliação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: extrativo
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache dos modelos de embedding
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('app/config.py') }}

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Pipeline de ingestão
        run: python -m app.pipeline

      - name: Testes
        run: python -m pytest -q

      - name: Avaliação do modelo (critérios mínimos)
        run: python -m avaliacao.executar_avaliacao --rapido --sem-relatorio

      - name: Publicar resultado da avaliação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avaliacao
          path: avaliacao/resultados/extrativo.json

  web:
    name: Front-end — lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
